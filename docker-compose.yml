services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: trackflow, POSTGRES_PASSWORD: trackflow, POSTGRES_DB: trackflow}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  backend:
    build: ./backend
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
    command: sh -c "python manage.py makemigrations accounts shipments audit && python manage.py migrate && python manage.py seed && gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000"
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
